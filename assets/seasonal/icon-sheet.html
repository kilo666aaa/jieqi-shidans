<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24节气独立徽记校样</title><link rel="stylesheet" href="../../css/seasonal.css"><style>body{margin:24px;background:#eeefe5;color:#294b3d;font:600 14px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}article{background:#fffdf6;padding:18px;border:1px solid #d7ddce;border-radius:20px;text-align:center}article h2{font-size:16px;margin:8px}article svg.seasonal-icon{width:120px;height:120px}.small{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}.small svg.seasonal-icon{width:58px;height:58px}.small span{font-size:10px;color:#70806a}@media(max-width:700px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}</style><h1>二十四节气 · 独立原创徽记</h1><p>统一120画布；上为120px校样，下为目录实际58px预览。中心图形各自独立，不含教学底座。</p><main id="sheet"></main><script src="../../js/seasonal.js"></script><script>document.getElementById('sheet').innerHTML=Object.values(JQ.SEASONAL.data).map(function(d){return '<article>'+JQ.SEASONAL.icon(d.id)+'<h2>'+d.name+'</h2><div class="small">'+JQ.SEASONAL.icon(d.id)+'<span>58px</span></div></article>';}).join('');</script></html>
